# /etc/nginx/conf.d/smoke.conf — web 서버 리버스 프록시
# 11/26: 설치. 11/27: 적용 완료 (/ → Tomcat, /webmail/ → Roundcube). Tomcat Connector 는 127.0.0.1 에만.
# 적용 전: sudo setsebool -P httpd_can_network_connect 1   (SELinux 가 nginx → 8080 연결을 막지 않게)
server {
    listen 80;
    server_name web.smoke.local;
    client_max_body_size 64m;          # 첨부 업로드 (파일당 20MB × 3)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 11/27 추가 — Roundcube 1.7 웹메일 [재구성본: 구조(public_html 만 노출, PHP-FPM, PATH_INFO)는 확인한 그대로,
    #                세부 문법은 서버 원본과 다를 수 있어 다음 작업에서 원본 사본으로 교체]
    location ^~ /webmail/ {
        alias /var/www/roundcube/public_html/;
        index index.php;
        location ~ ^/webmail/(.+\.php)(/.*)?$ {
            alias /var/www/roundcube/public_html/$1;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/roundcube/public_html/$1;
            fastcgi_param PATH_INFO $2;
        }
    }
}
