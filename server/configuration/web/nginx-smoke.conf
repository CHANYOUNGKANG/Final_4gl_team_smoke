# /etc/nginx/conf.d/smoke.conf — web 서버 리버스 프록시
# 11/26: nginx 설치까지 완료. 이 설정의 적용·응답 확인은 다음 작업(WORKLOG 참고).
# 적용 전: sudo setsebool -P httpd_can_network_connect 1   (SELinux 가 nginx → 8080 연결을 막지 않게)
server {
    listen 80;
    server_name web.smoke.local;
    client_max_body_size 64m;          # 첨부 업로드 (파일당 20MB × 3)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
