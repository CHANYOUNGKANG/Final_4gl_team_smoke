# /etc/ssh/sshd_config.d/10-smoke.conf — mgmt·web·data 3대 공통 (Ansible sshd.yml 로 배포)
# [재구성본] 11/27 3대에서 `sshd -T` 로 확인한 적용값을 정리한 파일이다.
#            mgmt 의 원본 플레이북(sshd.yml)은 다음 작업에서 가린 사본으로 교체한다.
# 주의: 설치 때 생긴 /etc/ssh/sshd_config.d/01-permitrootlogin.conf 가 먼저 읽혀
#       PermitRootLogin yes 가 유지됐다 → 그 파일을 지운 뒤 적용값을 다시 확인했다.
PermitRootLogin no
AllowUsers rocky
MaxAuthTries 3
LoginGraceTime 60
Banner /etc/issue.net
# 다음 개선 후보 (아직 적용하지 않음): UseDNS no, GSSAPIAuthentication no — 재부팅 직후 접속 지연 완화
