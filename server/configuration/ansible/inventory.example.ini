# 실제 파일은 mgmt 서버 ~/ansible/inventory.ini (저장소에 올리지 않음)
# 11/26: GNS3 연동 전이라 web·data 는 VMware NAT 임시 주소로 접속했다.
#        연동 후에는 설계 주소(서비스·서버팜 VLAN의 .10)로 바꾼다. (이슈 #11 대역 확정 후)
# 그룹 이름을 호스트 이름과 다르게 둔다 (같으면 "Found both group and host with same name" 경고)

[mgmt_servers]
mgmt ansible_connection=local

[web_servers]
web ansible_host=WEB_HOST

[db_servers]
data ansible_host=DATA_HOST

[servers:children]
mgmt_servers
web_servers
db_servers
