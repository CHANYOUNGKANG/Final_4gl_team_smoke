# mgmt: /etc/rsyslog.d/10-remote.conf — web·data 로그 수신, 서버·프로그램별 파일로 저장
# [재구성본] 저장 경로 /var/log/remote/<호스트>/<프로그램>.log 는 11/27 실제로 확인한 구조.
module(load="imtcp")
input(type="imtcp" port="514")
template(name="RemoteByHost" type="string" string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")
if $fromhost-ip != "127.0.0.1" then {
  action(type="omfile" dynaFile="RemoteByHost")
  stop
}
# 방화벽: 514/tcp 는 web·data 대역에서만 허용
