# web·data: /etc/rsyslog.d/90-forward.conf — 모든 로그를 mgmt 로 TCP 514 전송 (Ansible rsyslog.yml)
# [재구성본] 11/27 동작 확인(서버별 파일 생성·시험 로그 수신)을 바탕으로 정리. 원본 플레이북은 다음 작업에서 교체.
*.* action(type="omfwd" target="MGMT_HOST" port="514" protocol="tcp"
           queue.type="LinkedList" queue.filename="fwd_mgmt"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
