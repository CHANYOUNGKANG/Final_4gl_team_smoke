name: Auto label
on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, synchronize]
permissions:
  issues: write
  pull-requests: write
jobs:
  part:
    runs-on: ubuntu-latest
    steps:
      - name: Label by part
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          BODY: ${{ github.event.issue.body }}
          IS_PR: ${{ github.event.pull_request.number != '' }}
        run: |
          add() { gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label "$1" >/dev/null 2>&1 || true; }
          has() { grep -qE "$1" <<<"$2"; }
          if [ "$IS_PR" = "true" ]; then
            files=$(gh pr view "$NUM" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
            if has '^network/' "$files"; then add 네트워크; fi
            if has '^(server|app)/' "$files"; then add 서버; fi
            if has '^aws/' "$files"; then add AWS; fi
            if has '^cicd/' "$files"; then add CI/CD; fi
          else
            if has '네트워크 · 강민서' "$BODY"; then add 네트워크; fi
            if has '서버 · 이준호' "$BODY"; then add 서버; fi
            if has 'AWS · 이우빈' "$BODY"; then add AWS; fi
            if has 'CI/CD · 강찬영' "$BODY"; then add CI/CD; fi
          fi
