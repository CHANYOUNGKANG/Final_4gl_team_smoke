name: Labels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels.json', '.github/ISSUE_TEMPLATE/**']
permissions:
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r l; do
            gh label create "$(jq -r .name <<<"$l")" --repo "$GITHUB_REPOSITORY" \
              --color "$(jq -r .color <<<"$l")" --description "$(jq -r .description <<<"$l")" --force
          done
