<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('직원 로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('login')}"></header>
<main id="main" class="wrap page narrow">
  <h1>직원 로그인</h1>
  <p class="muted">공지 작성과 삭제는 담당 직원만 할 수 있습니다. 공지 읽기와 자료 다운로드는 로그인이 필요 없습니다.</p>
  <p th:if="${param.error}" class="flash error" role="alert">아이디 또는 비밀번호가 맞지 않습니다.</p>
  <p th:if="${!build.adminEnabled()}" class="flash">관리자 계정이 설정되지 않은 서버입니다. 운영 담당자가 ADMIN_PASSWORD 를 주입해야 로그인할 수 있습니다.</p>
  <form class="form" th:action="@{/login}" method="post">
    <label for="username">아이디</label>
    <input id="username" name="username" type="text" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="form-actions"><button type="submit" class="btn">로그인</button></div>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
