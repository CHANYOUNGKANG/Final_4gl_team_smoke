<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>블루그린 배포 시뮬레이터 · 스모커 팀</title>
<style>
:root{--bg:#0c1525;--panel:#142237;--line:#304159;--ink:#f3f6fb;--muted:#adbed2;--blue:#8dbbff;--green:#69e4b8;--amber:#ffbe73;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}main{max-width:1000px;margin:auto;padding:32px clamp(16px,5vw,58px) 64px}header,nav,.control,.readout,.labels,.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{padding-bottom:18px;border-bottom:1px solid var(--line)}.wordmark{font:900 25px/1 Arial;letter-spacing:-2px}.wordmark b{color:var(--green)}a{color:var(--blue)}h1{font-size:clamp(30px,6vw,60px);line-height:1.14;letter-spacing:-.065em;margin:32px 0 8px}h2{font-size:18px;margin:0}.intro,p{margin:0 0 20px;color:var(--muted)}nav{justify-content:flex-start;margin:22px 0 15px}button,select{font:inherit;color:var(--ink);background:#19283d;border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer}button:hover,select:hover{border-color:var(--muted)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}button[aria-pressed=true],#play{background:var(--green);border-color:var(--green);color:#09261f;font-weight:750}button:disabled{opacity:.5;cursor:default}section{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:clamp(15px,3vw,30px);margin-top:14px}.eyebrow{color:var(--green);font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.11em}.version{font:700 15px/1.5 ui-monospace,monospace}.blue{color:var(--blue)}.green{color:var(--green)}.plot{width:100%;display:block;margin:12px 0 4px}.wire{fill:none;stroke:var(--line);stroke-width:4}.route{stroke-dasharray:8 10;animation:flow 1.1s linear infinite}.blueRoute{stroke:var(--blue)}.greenRoute{stroke:var(--green)}@keyframes flow{to{stroke-dashoffset:-36}}[hidden]{display:none!important}.node{fill:#192c46;stroke:#455b78}.svgtxt{fill:var(--ink);font:700 18px sans-serif}.subtxt{fill:var(--muted);font:14px sans-serif}.traffic{fill:var(--ink);font:700 20px monospace}.labels{font-size:14px;color:var(--muted)}.control{margin:16px 0 0;justify-content:flex-start}.control select{padding:8px}.timeline{display:grid;gap:0;list-style:none;padding:0;margin:12px 0 0}.timeline li{display:grid;grid-template-columns:23px 1fr;gap:12px;position:relative;padding:8px 0}.timeline li:before{content:"";position:absolute;top:24px;bottom:-12px;left:10px;width:1px;background:var(--line)}.timeline li:last-child:before{display:none}.marker{align-self:start;position:relative;border:1px solid var(--line);border-radius:50%;width:21px;height:21px;font:12px/19px monospace;text-align:center;background:var(--panel)}.here .marker{background:var(--green);color:var(--bg)}.future{color:var(--muted)}.timeline small{display:block;color:var(--muted);line-height:1.45}.foot{margin-top:22px;color:var(--muted);font-size:13px}.status{margin:8px 0;color:var(--ink)}@media(max-width:500px){main{padding-top:20px}.plot .subtxt{display:none}button,select{font-size:14px}.control,nav{gap:6px}.plot{min-height:116px}}@media(prefers-reduced-motion:reduce){.route{animation:none}}
</style>
<main>
<header><span class="wordmark">SMOKE<b>.</b></span><a href="https://github.com/CHANYOUNGKANG/Final_4gl_team_smoke">프로젝트 README ↗</a></header>
<h1>블루그린 배포 시뮬레이터</h1>
<p class="intro">같은 공지 주소에서 어느 버전이 응답할까? 설계 시나리오를 골라 ALB의 트래픽과 Jenkins의 결정을 따라가 보세요.</p>
<nav aria-label="배포 시나리오"><button data-case="normal" aria-pressed="true">정상 배포</button><button data-case="block" aria-pressed="false">전환 전 검증 실패</button><button data-case="rollback" aria-pressed="false">전환 후 자동 롤백</button></nav>
<section aria-label="운영 트래픽">
<div class="readout"><h2>운영 트래픽 경로</h2><span class="eyebrow" id="counter"></span></div>
<svg class="plot" viewBox="0 0 720 176" role="img" aria-labelledby="plotTitle"><title id="plotTitle">공지 조회 경로</title>
<path class="wire" d="M126 88H228 M360 88H402Q422 88 438 68L450 49Q457 38 478 38H494 M360 88H402Q422 88 438 108L450 127Q457 138 478 138H494"/>
<path id="blueWire" class="wire route blueRoute" d="M126 88H228 M360 88H402Q422 88 438 68L450 49Q457 38 478 38H494"/>
<path id="greenWire" class="wire route greenRoute" d="M126 88H228 M360 88H402Q422 88 438 108L450 127Q457 138 478 138H494" hidden=""/>
<g text-anchor="middle"><rect class="node" x="2" y="55" width="124" height="65" rx="12"/><text class="svgtxt" x="64" y="85">공지 조회</text><text class="subtxt" x="64" y="105">사용자</text>
<rect class="node" x="228" y="55" width="132" height="65" rx="12"/><text class="svgtxt" x="294" y="85">ALB</text><text class="subtxt" x="294" y="105">HTTPS 443</text></g>
<rect class="node" x="494" y="5" width="223" height="65" rx="12"/><text x="515" y="34" class="svgtxt">Blue</text><text x="515" y="55" class="subtxt">notice · v1</text><text x="700" y="45" text-anchor="end" class="traffic" id="blue"></text>
<rect class="node" x="494" y="105" width="223" height="65" rx="12"/><text x="515" y="134" class="svgtxt">Green</text><text x="515" y="155" class="subtxt">notice · v2</text><text x="700" y="145" text-anchor="end" class="traffic" id="green"></text></svg>
<div id="status" class="status" role="status"></div>
<div class="control"><button id="play">재생</button><button id="next">한 단계 진행</button><button id="reset">처음으로</button><label>속도 <select id="speed"><option value="2400">1배</option><option value="1200">2배</option><option value="4800">0.5배</option></select></label></div>
</section>
<section><h2>배포 단계</h2><ol class="timeline" id="timeline"></ol></section>
<div class="foot"><span>설계 시연 · 화면의 트래픽 비율은 시나리오 예시입니다.</span><a href="https://github.com/CHANYOUNGKANG/Final_4gl_team_smoke/issues/1">실제 구축 진행률 ↗</a></div>
</main>
<script>
const start = ['Blue 운영', '운영 주소의 공지 조회 요청이 Blue v1으로 들어갑니다.', 'blue'];
const build = ['빌드와 이미지 등록', 'Jenkins가 Maven 테스트와 WAR 빌드를 마치고 커밋 태그 이미지를 ECR에 올립니다.', 'blue'];
const deploy = ['Green 배포', 'Ansible이 EKS에 Green v2를 배포합니다. 사용자는 계속 Blue를 이용합니다.', 'blue'];
const test = ['Green 검증 통과', '후보 버전 전용 경로에서 공지를 작성하고 같은 글을 조회합니다.', 'blue'];
const switchToGreen = ['ALB 전환', '운영 요청을 Green 대상 그룹으로 전환합니다. Blue는 복귀할 수 있도록 유지합니다.', 'green'];
const prefix = [start, build, deploy];
const scenarios = {
  normal: [...prefix, test, switchToGreen, ['배포 완료', '운영 주소에서 새 버전과 공지 조회를 확인합니다. Green이 계속 응답합니다.', 'green']],
  block: [...prefix, ['Green 검증 실패', '후보 버전에서 작성한 공지를 조회하지 못했습니다.', 'blue'], ['전환 차단', 'Jenkins가 배포를 중단합니다. 운영 주소는 계속 Blue v1입니다.', 'blue']],
  rollback: [...prefix, test, switchToGreen, ['전환 후 검사 실패', '운영 주소에서 공지 조회 오류를 감지합니다. Jenkins가 복귀 절차를 호출합니다.', 'green'], ['Blue 복귀 확인', 'ALB를 Blue로 되돌리고 운영 주소에서 v1 응답과 공지 조회를 확인합니다.', 'blue']]
};
const element = id => document.getElementById(id);
let choice = 'normal';
let position = 0;
let timer = null;
function stop() {
  clearTimeout(timer);
  timer = null;
}
function render() {
  const steps = scenarios[choice];
  const [title, description, route] = steps[position];
  const blue = route === 'blue';
  element('blue').textContent = blue ? '100%' : '0%';
  element('green').textContent = blue ? '0%' : '100%';
  element('blueWire').toggleAttribute('hidden', !blue);
  element('greenWire').toggleAttribute('hidden', blue);
  element('plotTitle').textContent = '운영 요청은 ' + (blue ? 'Blue v1' : 'Green v2') + '에 100% 전달됩니다.';
  element('counter').textContent = (position + 1) + ' / ' + steps.length;
  element('status').textContent = title + ' · ' + description;
  element('next').disabled = position === steps.length - 1;
  element('play').textContent = timer !== null ? '일시정지' : element('next').disabled ? '다시 재생' : '재생';
  document.querySelectorAll('[data-case]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.case === choice)));
  const timeline = element('timeline');
  timeline.replaceChildren();
  steps.forEach(([name, note], i) => {
    const row = document.createElement('li');
    row.className = i === position ? 'here' : i > position ? 'future' : '';
    if (i === position) row.setAttribute('aria-current', 'step');
    const marker = document.createElement('span');
    marker.className = 'marker';
    marker.textContent = i < position ? '✓' : i + 1;
    const body = document.createElement('div');
    body.textContent = name;
    if (i === position) {
      const detail = document.createElement('small');
      detail.textContent = note;
      body.append(detail);
    }
    row.append(marker, body);
    timeline.append(row);
  });
}
function schedule() {
  stop();
  if (position < scenarios[choice].length - 1) {
    timer = setTimeout(() => { position++; schedule(); }, Number(element('speed').value));
  }
  render();
}
document.querySelectorAll('[data-case]').forEach(button => button.onclick = () => {
  choice = button.dataset.case;
  position = 0;
  schedule();
});
element('play').onclick = () => {
  if (timer !== null) { stop(); render(); return; }
  if (position === scenarios[choice].length - 1) position = 0;
  schedule();
};
element('reset').onclick = () => { stop(); position = 0; render(); };
element('next').onclick = () => { stop(); position = Math.min(position + 1, scenarios[choice].length - 1); render(); };
element('speed').onchange = () => { if (timer !== null) schedule(); };
render();
</script>
</html>
